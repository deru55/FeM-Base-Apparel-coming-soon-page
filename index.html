<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Base Apparel coming soon page</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="header">
      <img src="./images/logo.svg" alt="Base Apparel" class="header__logo" />
    </header>

    <main>
      <picture class="hero">
        <source media="(min-width: 768px)" srcset="./images/hero-desktop.jpg" />

        <img src="./images/hero-mobile.jpg" alt="" class="hero__image" />
      </picture>

      <section class="intro">
        <h1 class="intro__title"><span class="intro__title-highlight">We're</span> coming soon</h1>

        <p class="intro__description">
          Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our
          launch deals.
        </p>

        <form class="form" novalidate>
          <div class="form__group">
            <input
              type="email"
              class="form__email-input"
              name="email"
              placeholder="Email Address"
              aria-label="Email Address"
              aria-describedby="email-error"
              aria-invalid="false"
              required
            />

            <img src="./images/icon-error.svg" alt="" class="form__error-icon" aria-hidden="true" />

            <button type="submit" class="form__submit-btn" aria-label="Submit email">
              <img src="./images/icon-arrow.svg" alt="" aria-hidden="true" />
            </button>

            <p id="email-error" class="" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
